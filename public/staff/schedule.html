<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Scheduling | DampScan staff</title>
<meta name="theme-color" content="#0c1a2b" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" /><link rel="manifest" href="/staff/manifest.webmanifest" /><link rel="apple-touch-icon" href="/staff/icon-180.png" /><meta name="apple-mobile-web-app-capable" content="yes" /><meta name="mobile-web-app-capable" content="yes" />
<link rel="preload" as="font" type="font/woff2" href="/assets/fonts/plus-jakarta-sans-var.woff2" crossorigin />
<link rel="stylesheet" href="/staff/staff.css" /><link rel="stylesheet" href="/staff/area.css" /><link rel="stylesheet" href="/staff/shell.css" /><link rel="stylesheet" href="/staff/history.css" />
<script>
/* Both sites share this staff area, so the hostname decides whose name is on
   it. This runs in the head, before anything is painted, so neither brand ever
   flashes the other's. The markup carries both lockups; staff.css hides one. */
(function brand(){
  var ati = /(^|\.)atidampsurvey\.co\.uk$/i.test(location.hostname);
  if (!ati) return;
  document.documentElement.setAttribute('data-brand', 'ati');
  document.title = document.title.replace('DampScan', 'ATi Damp Survey');
  var icon = document.querySelector('link[rel="icon"]');
  if (icon) { icon.type = 'image/png'; icon.href = '/assets/ati-mark.png'; }
})();
</script>
<link rel="stylesheet" href="/staff/board.css" /><link rel="stylesheet" href="/staff/schedule.css" />
</head>
<body>

<header class="top">
  <a href="/" class="logo brand-dampscan" aria-label="DampScan home">
    <span class="logo-type">
      <span class="logo-word">Damp<span class="scan">Scan</span></span>
      <span class="logo-tag">Survey Specialists</span>
    </span>
  </a>
  <a href="/" class="logo brand-ati" aria-label="ATi Damp Survey home">
    <span class="logo-type">
      <span class="logo-word">ATi <span class="scan">Damp</span></span>
      <span class="logo-tag">Survey Practice</span>
    </span>
  </a>
  <nav class="tabs" aria-label="Sections">
    <a href="/staff/due.html">Due</a>
    <a href="/staff/dashboard.html">Dashboard</a>
    <a href="/staff/jobs.html" >Jobs</a>
    <a href="/staff/quoted.html">Quotes</a>
    <a href="/staff/clients.html">Clients</a>
    <a href="/staff/company.html">Company</a>
  </nav>
  <div class="top-end">
    <button class="btn btn--ghost btn--sm" id="refresh">Refresh</button>
    <button class="btn btn--ghost btn--sm" id="logout">Sign out</button>
  </div>
</header>

<main class="wrap">
  <h1 class="records-title tab-h1">Scheduling</h1>
  <div class="ss" role="search">
    <label for="ss-q" class="sr-only">Find a customer</label>
    <input id="ss-q" type="search" autocomplete="off" placeholder="Find a customer: name, postcode, phone, email" />
    <ul class="ss-list" id="ss-list" hidden></ul>
  </div>
  <div class="sch-actions">
    <button class="sch-act is-main" type="button" id="newc-open"><span aria-hidden="true">+</span> New customer</button>
    <button class="sch-act" type="button" id="free-open">Who's free?</button>
  </div>
  <p class="panel-note" id="note" role="status"></p>
  <section class="sched-urgent" id="urgent" aria-label="Needs you now" hidden></section>
  <div class="c-seg sch-views" role="group" aria-label="View">
    <button type="button" data-view="book" aria-pressed="true">To book <span id="n-book"></span></button>
    <button type="button" data-view="plan" aria-pressed="false">Day plan</button>
    <button type="button" data-view="after" aria-pressed="false">After <span id="n-after"></span></button>
  </div>
  <div class="sch-pane" data-pane="book"><h2 class="sched-h">To book</h2><div class="sched-board" id="board"></div></div>
  <div class="sch-pane is-off" data-pane="plan"><div class="dsp" id="dispatch"></div></div>
  <div class="sch-pane is-off" data-pane="after"><h2 class="sched-h">After the visit</h2><div class="sched-board sched-after" id="after"></div></div>
  <dialog class="sched-dialog sch-free" id="free-dlg" aria-labelledby="free-h">
    <div class="sch-free-top"><h2 id="free-h">Who's free</h2><button class="scc-x" type="button" id="free-close" aria-label="Close">×</button></div>
    <section class="sched-free" id="free">
      <div class="sch-free-ask"><label for="free-who">Show</label><select id="free-who"><option value="">Everyone</option><option value="tom">Tom</option><option value="ben">Ben</option><option value="ronnie">Ronnie</option><option value="scott">Scott</option></select>
        <label for="free-pc">Caller's postcode</label><input id="free-pc" autocomplete="off" placeholder="e.g. SE15 4AB" /><button class="btn btn--ghost btn--sm" id="free-go" type="button">Check travel</button></div>
      <ol class="free-days" id="free-days"></ol>
    </section>
  </dialog>
  <dialog class="sched-dialog" id="book">
    <form method="dialog" id="book-form">
      <h2 id="book-title">Book</h2>
      <label id="b-for-row" hidden>For <select id="b-for"></select></label>
      <label>Day <input type="date" id="b-date" required /></label>
      <div class="sched-row"><button class="btn btn--ghost btn--sm" type="button" id="b-today">Today</button><button class="btn btn--ghost btn--sm" type="button" id="b-tomorrow">Tomorrow</button></div>
      <label>Time <input type="time" id="b-time" step="900" required /></label>
      <label>Who is going <select id="b-who" required><option value="">Pick who is going</option><option value="tom">Tom</option><option value="ben">Ben</option><option value="ronnie">Ronnie</option><option value="scott">Scott</option></select></label>
      <label>Survey <select id="b-type"><option value="">Pick the survey</option></select></label>
      <div id="b-extras-wrap" hidden><fieldset class="b-extras" id="b-extras"><legend>Extras</legend></fieldset>
      <label>Total £ <input type="number" id="b-price" inputmode="decimal" min="0" step="1" /></label></div>
      <p class="panel-note" id="b-note" role="status"></p>
      <a class="btn btn--ghost btn--sm" id="b-hours" hidden href="/staff/hours.html?area=damp">Set their hours</a>
      <div class="b-acts"><button class="btn btn--primary" type="submit" id="b-go">Book it</button><button class="btn btn--ghost" type="button" id="b-pencil">Pencil in (48h)</button><button class="btn btn--ghost" value="cancel" type="button" id="b-cancel">Cancel</button></div>
    </form>
  </dialog>
  <dialog class="sched-dialog" id="newc">
    <form method="dialog" id="newc-form">
      <h2>New customer</h2>
      <label>Name <input id="nc-name" required autocomplete="off" /></label>
      <label>Phone <input id="nc-phone" type="tel" inputmode="tel" autocomplete="off" /></label>
      <label>Postcode <input id="nc-postcode" required autocomplete="off" /></label>
      <label>Email <input id="nc-email" type="email" autocomplete="off" /></label>
      <label>Address <input id="nc-address" autocomplete="off" /></label>
      <label>What they need <textarea id="nc-note" rows="3"></textarea></label>
      <label>Business <select id="nc-site"><option value="auto">From the postcode</option><option value="ati-london">ATi Damp Survey</option><option value="dampscan">DampScan</option></select></label>
      <p class="panel-note" id="newc-note" role="status"></p>
      <div class="top-end"><button class="btn btn--ghost" type="button" id="newc-open-same" hidden>Open their card</button><button class="btn btn--ghost" type="button" id="newc-cancel">Cancel</button><button class="btn btn--primary" type="submit">Add</button></div>
    </form>
  </dialog>
</main>
<script src="/staff/ui.js"></script><script src="/staff/area.js"></script>
<script src="/staff/messages.js"></script><script src="/staff/calendar-actions.js"></script><script src="/staff/calendar-pop-parts.js"></script><script src="/staff/job-todos.js"></script><script src="/staff/calendar-pop.js"></script><script src="/staff/pop-history.js"></script>
<script src="/staff/dispatch.js"></script><script src="/staff/after-visit.js"></script><script src="/staff/sched-detail.js"></script><script src="/staff/sched-next.js"></script><script src="/staff/sched-card.js"></script><script src="/staff/sched-search.js"></script><script src="/staff/sched-new.js"></script><script src="/staff/sched-extras.js"></script><script src="/staff/schedule.js"></script><script src="/staff/sched-views.js"></script>
</body>
</html>
