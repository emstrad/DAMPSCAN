<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Company | DampScan</title>
<meta name="theme-color" content="#0c1a2b" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" /><link rel="manifest" href="/staff/manifest.webmanifest" /><link rel="apple-touch-icon" href="/staff/icon-180.png" /><meta name="apple-mobile-web-app-capable" content="yes" /><meta name="mobile-web-app-capable" content="yes" />
<link rel="preload" as="font" type="font/woff2" href="/assets/fonts/plus-jakarta-sans-var.woff2" crossorigin />
<link rel="stylesheet" href="/staff/staff.css" /><link rel="stylesheet" href="/staff/area.css" /><link rel="stylesheet" href="/staff/shell.css" /><link rel="stylesheet" href="/staff/history.css" /><link rel="stylesheet" href="/staff/board.css" /><link rel="stylesheet" href="/staff/company.css" />
<script>
/* Both sites share this staff area, so the hostname decides whose name is on
   it. This runs in the head, before anything is painted, so neither brand ever
   flashes the other's. The markup carries both lockups; staff.css hides one. */
(function brand(){
  var ati = /(^|\.)atidampsurvey\.co\.uk$/i.test(location.hostname);
  if (!ati) return;
  document.documentElement.setAttribute('data-brand', 'ati');
  document.title = document.title.replace('DampScan', 'ATi Damp Survey');
  var icon = document.querySelector('link[rel="icon"]');
  if (icon) { icon.type = 'image/png'; icon.href = '/assets/ati-mark.png'; }
})();
</script>
</head>
<body>

<header class="top">
  <a href="/" class="logo brand-dampscan" aria-label="DampScan home">
    <span class="logo-type">
      <span class="logo-word">Damp<span class="scan">Scan</span></span>
      <span class="logo-tag">Survey Specialists</span>
    </span>
  </a>
  <a href="/" class="logo brand-ati" aria-label="ATi Damp Survey home">
    <span class="logo-type">
      <span class="logo-word">ATi <span class="scan">Damp</span></span>
      <span class="logo-tag">Survey Practice</span>
    </span>
  </a>
  <nav class="tabs" aria-label="Sections">
    <a href="/staff/due.html">Due</a>
    <a href="/staff/dashboard.html">Dashboard</a>
    <a href="/staff/jobs.html">Jobs</a>
    <a href="/staff/quoted.html">Quotes</a>
    <a href="/staff/clients.html">Clients</a>
    <a href="/staff/company.html">Company</a>
  </nav>
  <div class="top-end">
    <button class="btn btn--ghost btn--sm" id="refresh">Refresh</button>
    <button class="btn btn--ghost btn--sm" id="logout">Sign out</button>
  </div>
</header>

<main class="wrap">
  <h1 class="sr-only">Company</h1>
  <div class="pills co-tabs" role="tablist" aria-label="Company">
    <button class="pill" type="button" role="tab" data-tab="overview" aria-pressed="true">Overview</button>
    <button class="pill" type="button" role="tab" data-tab="pay" aria-pressed="false">Pay</button>
    <button class="pill" type="button" role="tab" data-tab="money" aria-pressed="false">Money</button>
    <button class="pill" type="button" role="tab" data-tab="bank" aria-pressed="false">Bank check</button>
    <button class="pill" type="button" role="tab" data-tab="growth" aria-pressed="false">Growth</button>
    <a class="pill" href="/staff/dashboard.html?area=damp">Website</a>
    <a class="pill" href="/staff/insights.html?area=damp">Insights</a>
    <a class="pill" href="/staff/records.html?area=damp">Records</a>
  </div>
  <div id="tab-overview"></div>
  <div id="tab-money" hidden></div>
  <div id="tab-bank" hidden></div>
  <div id="tab-growth" hidden></div>
  <div id="tab-pay" hidden>
  <div class="state" id="state">Loading…</div>
  <div id="content" hidden>
    <div class="pay-books" id="books"></div>
    <div class="pay-cards" id="cards"></div>
    <details class="pay-surveys" id="surveys"><summary class="c-row" id="surveys-sum"><span class="c-l"><b>Surveys</b></span><span class="c-r"><span class="c-chev">›</span></span></summary>
    <div class="pills pay-range" role="group" aria-label="Period" id="range"></div>
    <div class="pay-book" id="book"></div>
    <p class="pay-check" id="check" role="status"></p>
    </details>
    <details class="pay-split" id="split"><summary>Split for new surveys</summary><div id="split-form"></div></details>
  </div>
  </div>
</main>

<script src="/staff/ui.js"></script><script src="/staff/area.js"></script>
<script src="/staff/messages.js"></script><script src="/staff/calendar-actions.js"></script><script src="/staff/calendar-pop-parts.js"></script><script src="/staff/job-todos.js"></script><script src="/staff/calendar-pop.js"></script><script src="/staff/pop-history.js"></script>
<script src="/staff/company-pay.js"></script><script src="/staff/company-tide.js"></script><script src="/staff/company-money.js"></script><script src="/staff/company-overview.js"></script><script src="/staff/company-growth.js"></script><script src="/staff/seg-tabs.js"></script><script src="/staff/company-tabs.js"></script>
</body>
</html>
