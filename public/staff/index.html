<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Staff login | DampScan</title>
<meta name="theme-color" content="#0c1a2b" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/staff/staff.css" />
<script>
/* Both sites share this staff area, so the hostname decides whose name is on
   it. This runs in the head, before anything is painted, so neither brand ever
   flashes the other's. The markup carries both lockups; staff.css hides one. */
(function brand(){
  var ati = /(^|\.)atidampsurvey\.co\.uk$/i.test(location.hostname);
  if (!ati) return;
  document.documentElement.setAttribute('data-brand', 'ati');
  document.title = document.title.replace('DampScan', 'ATi Damp Survey');
  var icon = document.querySelector('link[rel="icon"]');
  if (icon) { icon.type = 'image/png'; icon.href = '/assets/ati-mark.png'; }
})();
</script>
</head>
<body>
<main class="login-wrap">
  <div class="login-card">
    <a href="/" class="logo brand-dampscan" aria-label="DampScan home">
      <span class="logo-type">
        <span class="logo-word">Damp<span class="scan">Scan</span></span>
        <span class="logo-tag">Survey Specialists</span>
      </span>
    </a>
    <a href="/" class="logo brand-ati" aria-label="ATi Damp Survey home">
      <span class="logo-type">
        <span class="logo-word">ATi <span class="scan">Damp</span></span>
        <span class="logo-tag">Survey Practice</span>
      </span>
    </a>

    <h1>Staff login</h1>

    <form id="login-form" novalidate>
      <div class="form-row">
        <label for="code">Access code</label>
        <input id="code" name="code" type="password" inputmode="numeric" autocomplete="one-time-code"
               autocapitalize="off" spellcheck="false" required />
      </div>
      <!-- One generic message for every failure, so a wrong code and a throttled
           attempt are not distinguishable. -->
      <span class="err" id="error" role="alert"></span>
      <button type="submit" class="btn btn--primary btn--block" id="submit">Sign in</button>
    </form>

    <p class="login-foot">Authorised staff only. All sign in attempts are logged.</p>
  </div>
</main>

<script>
(function login(){
  const form = document.getElementById('login-form');
  const error = document.getElementById('error');
  const submit = document.getElementById('submit');
  const code = document.getElementById('code');

  function fail(message){
    error.textContent = message;
    error.classList.add('is-shown');
    submit.disabled = false;
    submit.textContent = 'Sign in';
    code.value = '';
    code.focus();
  }

  form.addEventListener('submit', async e => {
    e.preventDefault();
    error.classList.remove('is-shown');

    if (!code.value.trim()) {
      fail('Enter your access code.');
      return;
    }

    submit.disabled = true;
    submit.textContent = 'Signing in…';

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify({ code: code.value.trim() })
      });
      if (res.ok) {
        location.replace('/staff/dashboard.html');
        return;
      }
      const body = await res.json().catch(function(){ return null; });
      fail((body && body.error) || 'That code was not recognised.');
    } catch (err) {
      fail('Could not reach the server. Check your connection and try again.');
    }
  });

  code.focus();
})();
</script>
</body>
</html>
