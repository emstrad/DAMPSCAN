<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Lab | DampScan staff</title>
<meta name="theme-color" content="#0c1a2b" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" /><link rel="manifest" href="/staff/manifest.webmanifest" /><link rel="apple-touch-icon" href="/staff/icon-180.png" /><meta name="apple-mobile-web-app-capable" content="yes" /><meta name="mobile-web-app-capable" content="yes" />
<link rel="preload" as="font" type="font/woff2" href="/assets/fonts/plus-jakarta-sans-var.woff2" crossorigin />
<link rel="stylesheet" href="/staff/staff.css" /><link rel="stylesheet" href="/staff/area.css" /><link rel="stylesheet" href="/staff/shell.css" /><link rel="stylesheet" href="/assets/book.css" /><link rel="stylesheet" href="/staff/hours.css" />
<script>
/* Both sites share this staff area, so the hostname decides whose name is on
   it. This runs in the head, before anything is painted, so neither brand ever
   flashes the other's. The markup carries both lockups; staff.css hides one. */
(function brand(){
  var ati = /(^|\.)atidampsurvey\.co\.uk$/i.test(location.hostname);
  if (!ati) return;
  document.documentElement.setAttribute('data-brand', 'ati');
  document.title = document.title.replace('DampScan', 'ATi Damp Survey');
  var icon = document.querySelector('link[rel="icon"]');
  if (icon) { icon.type = 'image/png'; icon.href = '/assets/ati-mark.png'; }
})();
</script>
</head>
<body>

<header class="top">
  <a href="/" class="logo brand-dampscan" aria-label="DampScan home">
    <span class="logo-type">
      <span class="logo-word">Damp<span class="scan">Scan</span></span>
      <span class="logo-tag">Survey Specialists</span>
    </span>
  </a>
  <a href="/" class="logo brand-ati" aria-label="ATi Damp Survey home">
    <span class="logo-type">
      <span class="logo-word">ATi <span class="scan">Damp</span></span>
      <span class="logo-tag">Survey Practice</span>
    </span>
  </a>
  <nav class="tabs" aria-label="Sections">
    <a href="/staff/due.html">Due</a>
    <a href="/staff/dashboard.html">Dashboard</a>
    <a href="/staff/jobs.html" >Jobs</a>
    <a href="/staff/quoted.html">Quotes</a>
    <a href="/staff/clients.html">Clients</a>
    <a href="/staff/bank.html">Bank</a>
  </nav>
  <div class="top-end">
    <button class="btn btn--ghost btn--sm" id="refresh">Refresh</button>
    <button class="btn btn--ghost btn--sm" id="logout">Sign out</button>
  </div>
</header>

<main class="wrap">
  <h1 class="records-title">Lab</h1>

  <section class="panel" aria-labelledby="h-live">
    <h2 id="h-live">Live on the websites</h2>
    <label class="lab-switch"><input type="checkbox" id="sw-slots" data-key="booking_slots" disabled /> Pick a time, after the booking form is sent</label>
    <label class="lab-switch"><input type="checkbox" id="sw-quiz" data-key="survey_quiz" disabled /> "What do you need?", the survey and its price, after the time</label>
    <p class="panel-note" id="sw-note" role="status"></p>
  </section>

  <section class="panel" aria-labelledby="h-slots">
    <h2 id="h-slots">Pick a time, at the end of the booking form</h2>
    <div class="ranges"><label for="lab-pc">Customer's postcode</label> <input id="lab-pc" autocomplete="off" placeholder="e.g. CT5 1AA" /> <button class="btn btn--ghost btn--sm" id="lab-pc-go" type="button">Show their times</button></div>
    <div class="lab-preview" id="slots"></div>
  </section>

  <section class="panel" aria-labelledby="h-portal">
    <h2 id="h-portal">Customer portal (preview)</h2>
    <div class="ranges"><label for="pt-q">Customer's name or postcode</label> <input id="pt-q" autocomplete="off" /> <button class="btn btn--ghost btn--sm" id="pt-go" type="button">Find</button></div>
    <div id="pt-found"></div>
  </section>

  <section class="panel" aria-labelledby="h-quiz">
    <h2 id="h-quiz">Which survey do I need?</h2>
    <div class="lab-preview quiz" id="quiz"></div>
    <p class="panel-note" id="quiz-out" role="status"></p>
  </section>
</main>
<style>.lab-switch{display:flex;align-items:center;gap:12px;min-height:44px;font-size:16px;cursor:pointer}.lab-switch input{width:22px;height:22px;flex:none}</style>
<script src="/staff/ui.js"></script><script src="/staff/area.js"></script>
<script src="/assets/survey-quiz.js"></script>
<script src="/assets/book-times.js"></script>
<script src="/staff/lab.js"></script>
</body>
</html>
