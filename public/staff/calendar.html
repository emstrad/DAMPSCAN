<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Today | DampScan</title>
<meta name="theme-color" content="#0c1a2b" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" /><link rel="manifest" href="/staff/manifest.webmanifest" /><link rel="apple-touch-icon" href="/staff/icon-180.png" /><meta name="apple-mobile-web-app-capable" content="yes" /><meta name="mobile-web-app-capable" content="yes" />
<link rel="preload" as="font" type="font/woff2" href="/assets/fonts/plus-jakarta-sans-var.woff2" crossorigin />
<link rel="stylesheet" href="/staff/staff.css" /><link rel="stylesheet" href="/staff/area.css" /><link rel="stylesheet" href="/staff/shell.css" /><link rel="stylesheet" href="/staff/history.css" /><link rel="stylesheet" href="/staff/board.css" />
<script>
/* Both sites share this staff area, so the hostname decides whose name is on
   it. This runs in the head, before anything is painted, so neither brand ever
   flashes the other's. The markup carries both lockups; staff.css hides one. */
(function brand(){
  var ati = /(^|\.)atidampsurvey\.co\.uk$/i.test(location.hostname);
  if (!ati) return;
  document.documentElement.setAttribute('data-brand', 'ati');
  document.title = document.title.replace('DampScan', 'ATi Damp Survey');
  var icon = document.querySelector('link[rel="icon"]');
  if (icon) { icon.type = 'image/png'; icon.href = '/assets/ati-mark.png'; }
})();
</script>
</head>
<body>

<header class="top">
  <a href="/" class="logo brand-dampscan" aria-label="DampScan home">
    <span class="logo-type">
      <span class="logo-word">Damp<span class="scan">Scan</span></span>
      <span class="logo-tag">Survey Specialists</span>
    </span>
  </a>
  <a href="/" class="logo brand-ati" aria-label="ATi Damp Survey home">
    <span class="logo-type">
      <span class="logo-word">ATi <span class="scan">Damp</span></span>
      <span class="logo-tag">Survey Practice</span>
    </span>
  </a>
  <nav class="tabs" aria-label="Sections">
    <a href="/staff/due.html">Due</a>
    <a href="/staff/dashboard.html">Dashboard</a>
    <a href="/staff/jobs.html">Jobs</a>
    <a href="/staff/quoted.html">Quotes</a>
    <a href="/staff/clients.html">Clients</a>
    <a href="/staff/bank.html">Bank</a>
  </nav>
  <div class="top-end">
    <button class="btn btn--ghost btn--sm" id="refresh">Refresh</button>
    <button class="btn btn--ghost btn--sm" id="logout">Sign out</button>
  </div>
</header>

<main class="wrap work">
  <h1 class="sr-only">Today</h1>
  <div class="state" id="state">Loading…</div>
  <div id="content" class="today" hidden>
    <section class="cal-main" aria-labelledby="title">
      <div class="pills cal-filters" id="filters" role="group" aria-label="Company">
        <button type="button" class="pill" data-area-filter="">All</button>
        <button type="button" class="pill" data-area-filter="damp">ATi &amp; DampScan</button>
        <button type="button" class="pill" data-area-filter="roofing">Verge Roofing</button>
        <button type="button" class="pill" data-area-filter="ac">CoolRight</button>
      </div>
      <div class="cal-bar">
        <h2 id="title" aria-live="polite"></h2>
        <div class="cal-nav">
          <button class="btn btn--ghost btn--sm" id="prev" aria-label="Previous">&larr;</button>
          <button class="btn btn--ghost btn--sm" id="today">This week</button>
          <button class="btn btn--ghost btn--sm" id="next" aria-label="Next">&rarr;</button>
        </div>
        <a class="btn btn--sm" id="who-free" href="/staff/schedule.html#free" hidden>Who's free?</a>
        <div class="pills" role="group" aria-label="View">
          <button type="button" class="pill" data-view="week">Week</button>
          <button type="button" class="pill" data-view="month">Month</button>
        </div>
      </div>
      <div id="cal-view"></div>
    </section>
    <div class="today-lists">
      <section class="today-panel" aria-labelledby="unbooked-h">
        <h2 id="unbooked-h">Not booked in yet <span class="act-count" id="unbooked-count"></span> <a class="link-btn" href="/staff/schedule.html">Scheduling</a></h2>
        <ul class="tl-list" id="unbooked"></ul>
      </section>
      <section class="today-panel" aria-labelledby="needs-h">
        <h2 id="needs-h">Needs doing</h2>
        <div id="needs"></div>
        <p class="panel-note"><a href="/staff/due.html">Everything outstanding</a> is on the Due page. <button class="linkish" id="ics" type="button">Add this week to my calendar</button></p>
      </section>
    </div>
  </div>
</main>

<script src="/staff/ui.js"></script><script src="/staff/area.js"></script>
<script src="/staff/messages.js"></script><script src="/staff/calendar-actions.js"></script>
<script src="/staff/calendar-pop-parts.js"></script><script src="/staff/job-todos.js"></script><script src="/staff/calendar-pop.js"></script><script src="/staff/sched-card.js"></script><script src="/staff/pop-history.js"></script><script src="/staff/calendar-ac.js"></script><script src="/staff/calendar-pencil.js"></script><script src="/staff/calendar.js"></script><script src="/staff/today-todo.js"></script>
</body>
</html>
