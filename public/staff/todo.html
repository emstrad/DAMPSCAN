<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>What's next | DampScan</title>
<meta name="theme-color" content="#0c1a2b" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" /><link rel="manifest" href="/staff/manifest.webmanifest" /><link rel="apple-touch-icon" href="/staff/icon-180.png" /><meta name="apple-mobile-web-app-capable" content="yes" /><meta name="mobile-web-app-capable" content="yes" />
<link rel="preload" as="font" type="font/woff2" href="/assets/fonts/plus-jakarta-sans-var.woff2" crossorigin />
<link rel="stylesheet" href="/staff/staff.css" /><link rel="stylesheet" href="/staff/area.css" /><link rel="stylesheet" href="/staff/shell.css" /><link rel="stylesheet" href="/staff/history.css" /><link rel="stylesheet" href="/staff/board.css" /><link rel="stylesheet" href="/staff/next-up.css" />
<script>
/* Both sites share this staff area, so the hostname decides whose name is on
   it. This runs in the head, before anything is painted, so neither brand ever
   flashes the other's. The markup carries both lockups; staff.css hides one. */
(function brand(){
  var ati = /(^|\.)atidampsurvey\.co\.uk$/i.test(location.hostname);
  if (!ati) return;
  document.documentElement.setAttribute('data-brand', 'ati');
  document.title = document.title.replace('DampScan', 'ATi Damp Survey');
  var icon = document.querySelector('link[rel="icon"]');
  if (icon) { icon.type = 'image/png'; icon.href = '/assets/ati-mark.png'; }
})();
</script>
</head>
<body>

<header class="top">
  <a href="/" class="logo brand-dampscan" aria-label="DampScan home">
    <span class="logo-type">
      <span class="logo-word">Damp<span class="scan">Scan</span></span>
      <span class="logo-tag">Survey Specialists</span>
    </span>
  </a>
  <a href="/" class="logo brand-ati" aria-label="ATi Damp Survey home">
    <span class="logo-type">
      <span class="logo-word">ATi <span class="scan">Damp</span></span>
      <span class="logo-tag">Survey Practice</span>
    </span>
  </a>
  <nav class="tabs" aria-label="Sections">
    <a href="/staff/due.html">Due</a>
    <a href="/staff/dashboard.html">Dashboard</a>
    <a href="/staff/jobs.html">Jobs</a>
    <a href="/staff/quoted.html">Quotes</a>
    <a href="/staff/clients.html">Clients</a>
    <a href="/staff/company.html">Company</a>
  </nav>
  <div class="top-end">
    <button class="btn btn--ghost btn--sm" id="refresh">Refresh</button>
    <button class="btn btn--ghost btn--sm" id="logout">Sign out</button>
  </div>
</header>

<main class="wrap nu-wrap">
  <h1 class="sr-only">What's next</h1>
  <div class="c-summary nu-summary">
    <div><span class="c-label">You</span><b id="nu-big">0</b><span class="c-sub" id="nu-big-sub"></span></div>
    <div><span class="c-label">Them</span><b id="nu-them">0</b></div>
    <div><span class="c-label">Agent</span><b id="nu-agent">0</b></div>
    <div><span class="c-label">Booked</span><b id="nu-booked">0</b></div>
  </div>
  <label class="nu-search"><span class="sr-only">Find a customer</span><input id="nu-q" type="search" placeholder="Find a customer" autocomplete="off" /></label>
  <div class="c-seg nu-lanes" id="nu-lanes" role="group" aria-label="Whose move">
    <button type="button" data-lane="us" aria-pressed="true">You<span></span></button>
    <button type="button" data-lane="them" aria-pressed="false">Them<span></span></button>
    <button type="button" data-lane="agent" aria-pressed="false">Agent<span></span></button>
    <button type="button" data-lane="booked" aria-pressed="false">Booked<span></span></button>
  </div>
  <p class="state" id="nu-state">Loading…</p>
  <ul class="nu-list" id="nu-list"></ul>
  <p class="c-sub nu-empty" id="nu-empty" hidden></p>
  <details class="c-fold nu-fold" id="nu-cold" hidden><summary class="c-row"><span class="c-l"><b>Gone cold</b><small>To try again later</small></span><span class="c-r"><span class="c-amt" id="nu-cold-n"></span><span class="c-chev">›</span></span></summary><ul class="nu-list" id="nu-cold-list"></ul></details>
  <details class="c-fold nu-fold"><summary class="c-row"><span class="c-l"><b>All to-dos</b><small>Add one, or see yours, set by you, failed and done</small></span><span class="c-r"><span class="c-chev">›</span></span></summary>
    <form id="add" class="todo-add">
      <label class="todo-text">What needs doing <textarea id="text" rows="2" maxlength="2000" required></textarea></label>
      <label>For <select id="for"><option value="">Everyone</option></select></label>
      <label>Due <input id="due" type="date" /></label>
      <button class="btn btn--sm" type="submit">Add</button>
      <p class="panel-note" id="add-note" role="status"></p>
    </form>
    <div class="c-seg" role="group" aria-label="Show">
      <button type="button" data-view="open" aria-pressed="true">Mine</button>
      <button type="button" data-view="set" aria-pressed="false">Set by me</button>
      <button type="button" data-view="failed" aria-pressed="false">Failed</button>
      <button type="button" data-view="done" aria-pressed="false">Done</button>
    </div>
    <div class="state" id="state">Loading…</div>
    <ul class="todo-list" id="list"></ul>
  </details>
</main>

<script src="/staff/ui.js"></script><script src="/staff/area.js"></script>
<script src="/staff/messages.js"></script><script src="/staff/calendar-actions.js"></script><script src="/staff/calendar-pop-parts.js"></script><script src="/staff/job-todos.js"></script><script src="/staff/calendar-pop.js"></script><script src="/staff/sched-next.js"></script><script src="/staff/sched-card.js"></script><script src="/staff/pop-history.js"></script><script src="/staff/calendar-ac.js"></script><script src="/staff/todo.js"></script><script src="/staff/next-up.js"></script>
</body>
</html>
