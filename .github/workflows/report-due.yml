# Hourly check for survey reports past their 24 hours (lib/report-late.js),
# lapsed scheduling holds and the inbox scan. The hosting plan only runs its
# own schedules once a day. Runs only in VERTISE-DEV/DAMPSCAN, the mirror
# Vercel deploys from, because CRON_SECRET (the same value as on Vercel) is
# kept there and nowhere else; without it the step does nothing and the
# morning and evening runs still check.
name: Report due check
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    if: github.repository == 'VERTISE-DEV/DAMPSCAN'
    steps:
      - name: Check for overdue reports
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET not set, skipping"; exit 0; fi
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" https://dampscan.co.uk/api/cron/report-due
